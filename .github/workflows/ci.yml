name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check
        run: pnpm run t

      - name: Check changesets
        run: pnpm changeset status --since=origin/main

      - name: Build
        run: pnpm run build

  ruby:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        ruby: ['3.3', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: template/ruby
      - run: pnpm build
      - run: pnpm test:ruby

  native:
    name: SDK ${{ matrix.sdk }} / ${{ matrix.platform }} / ${{ matrix.output }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sdk: 58, platform: android, output: aab, os: ubuntu-24.04 }
          - { sdk: 58, platform: ios, output: unsigned, os: xcode-27, xcode: '27.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: template/ruby
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
      - name: Select Xcode
        if: matrix.platform == 'ios'
        run: sudo xcode-select --switch /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - run: pnpm build
      - run: pnpm test:e2e ${{ matrix.sdk }} ${{ matrix.platform }} ${{ matrix.output }}
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.sdk }}-${{ matrix.platform }}-${{ matrix.output }}
          path: .e2e-artifacts/
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, ruby, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Select Changesets mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2
      - name: Version packages and select release commit
        id: version
        env:
          RELEASE_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          release_commit=''
          if [ "$RELEASE_MODE" = version ]; then
            pnpm version-packages
            pnpm build
            pnpm run t
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'chore(release): version packages'
            git push origin HEAD:main
            release_commit=$(git rev-parse HEAD)
          else
            candidate=$(git log -1 --format=%H --grep='^chore(release): version packages$' --author='github-actions\[bot\]' -- package.json)
            if [ -n "$candidate" ]; then
              current_version=$(node -p "require('./package.json').version")
              candidate_version=$(git show "$candidate:package.json" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).version))')
              if [ "$current_version" = "$candidate_version" ]; then
                release_commit=$candidate
              fi
            fi
          fi
          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
      - name: Check out release commit
        if: steps.version.outputs.commit != ''
        run: git checkout --detach "$RELEASE_COMMIT"
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
      - name: Install npm with trusted publishing support
        if: steps.version.outputs.commit != ''
        run: npm install --global npm@11
      - name: Build release
        if: steps.version.outputs.commit != ''
        run: pnpm build
      - name: Check release
        if: steps.version.outputs.commit != ''
        run: pnpm run t
      - name: Publish release
        if: steps.version.outputs.commit != ''
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          published_versions=$(npm view "$package_name" versions --json)
          if ! PUBLISHED_VERSIONS="$published_versions" PACKAGE_VERSION="$package_version" node -e 'process.exit(JSON.parse(process.env.PUBLISHED_VERSIONS).includes(process.env.PACKAGE_VERSION) ? 0 : 1)'; then
            npm publish --access public --provenance
          fi
      - name: Create and push release tags
        if: steps.version.outputs.commit != ''
        run: |
          release_tag=$(node -p "const pkg = require('./package.json'); pkg.name + '@' + pkg.version")
          if ! git rev-parse -q --verify "refs/tags/$release_tag" > /dev/null; then
            git tag "$release_tag"
          fi
          test "$(git rev-parse "refs/tags/$release_tag^{commit}")" = "$(git rev-parse HEAD)"
          git push origin "refs/tags/$release_tag"
      - name: Create GitHub release
        if: steps.version.outputs.commit != ''
        run: |
          release_tag=$(node -p "const pkg = require('./package.json'); pkg.name + '@' + pkg.version")
          if ! gh release view "$release_tag" > /dev/null 2>&1; then
            gh release create "$release_tag" --verify-tag --generate-notes
          fi
