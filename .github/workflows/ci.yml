name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check
        run: pnpm run t

      - name: Check changesets
        if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository
        run: pnpm changeset status --since=origin/main

      - name: Build
        run: pnpm run build

  ruby:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        ruby: ['3.3', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: template/ruby
      - run: pnpm build
      - run: pnpm test:ruby

  native:
    name: SDK ${{ matrix.sdk }} / ${{ matrix.platform }} / ${{ matrix.output }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sdk: 58, platform: android, output: aab, os: ubuntu-24.04 }
          - { sdk: 58, platform: ios, output: unsigned, os: xcode-27, xcode: '27.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: template/ruby
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
      - name: Select Xcode
        if: matrix.platform == 'ios'
        run: sudo xcode-select --switch /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - run: pnpm build
      - run: pnpm test:e2e ${{ matrix.sdk }} ${{ matrix.platform }} ${{ matrix.output }}
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.sdk }}-${{ matrix.platform }}-${{ matrix.output }}
          path: .e2e-artifacts/
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error

  release-plan:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, ruby, native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version-pr-merged: ${{ steps.version-pr.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Identify merged version PR
        id: version-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "any(.[]; .merged_at != null and .merge_commit_sha == \"$GITHUB_SHA\" and .base.ref == \"$GITHUB_REF_NAME\" and .head.ref == (\"changeset-release/\" + .base.ref) and .head.repo.full_name == .base.repo.full_name)")
          printf 'merged=%s\n' "$merged" >> "$GITHUB_OUTPUT"
      - name: Select Changesets mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    if: needs.release-plan.outputs.mode == 'version'
    needs: release-plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_TITLE: 'chore(release): version packages'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Create or update version PR
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm version-packages
          commit-message: ${{ env.RELEASE_TITLE }}
          pr-title: ${{ env.RELEASE_TITLE }}

  publish:
    if: needs.release-plan.outputs.version-pr-merged == 'true' && needs.release-plan.outputs.mode != 'version'
    needs: release-plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Build release
        run: pnpm build
      - name: Check release
        run: pnpm run t
      - name: Publish approved versions
        run: pnpm exec changeset publish
      - name: Create and push release tags
        run: |
          pnpm exec changeset git-tag
          git push origin --tags
      - name: Create GitHub release
        run: |
          release_tag=$(node -p "const pkg = require('./package.json'); pkg.name + '@' + pkg.version")
          if ! gh release view "$release_tag" > /dev/null 2>&1; then
            gh release create "$release_tag" --verify-tag --generate-notes
          fi
