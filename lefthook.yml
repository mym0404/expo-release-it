check:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    format:
      run: pnpm format:check
    test:
      run: pnpm vitest -w false
    tsc:
      run: pnpm exec tsc --noEmit -p .

pre-commit:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    format:
      run: pnpm format:check
    test:
      run: pnpm vitest -w false
    tsc:
      run: pnpm exec tsc --noEmit -p .
commit-msg:
  commands:
    commitlint:
      run: npx --yes commitlint --edit
